version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: feature-store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  feature-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feature-server
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./feature-server:/app/feature-server
      - ./data:/app/data
    command: uvicorn feature-server.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis-data:
